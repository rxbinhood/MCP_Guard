[project]
name = "mcpguard"
version = "0.1.0"
description = "Security auditor for MCP (Model Context Protocol) servers: tool poisoning, vulnerable code, and rug-pull detection with an AI description judge."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "MCPGuard contributors" }]
dependencies = [
  "mcp>=1.9,<2",
  "typer>=0.12",
  "rich>=13",
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2.6",
  "httpx>=0.27",
  "deepdiff>=7",
]

[project.optional-dependencies]
# Static analysis engines (Semgrep + Bandit). Gitleaks is a Go binary, installed separately.
scanners = ["semgrep>=1.70", "bandit>=1.7"]
# Meta Llama Prompt Guard 2 in-process (needs ~1GB for torch CPU). Alternatively run the promptguard service.
promptguard = ["transformers>=4.44", "torch>=2.2"]
dev = ["pytest>=8", "ruff>=0.5", "anyio>=4"]

[project.scripts]
mcpguard = "mcpguard.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["mcpguard"]

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["frontend", "test_servers/*/node_modules"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["B008", "E501"]

[tool.ruff.lint.per-file-ignores]
# Test fixtures intentionally contain vulnerable code.
"test_servers/**" = ["S", "B", "SIM"]

[tool.pytest.ini_options]
testpaths = ["tests"]
