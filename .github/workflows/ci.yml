name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv venv --python 3.12 && uv pip install -e ".[dev,scanners]"
      - run: .venv/bin/ruff check mcpguard tests scripts
      - run: .venv/bin/pytest -q
      # Dogfood: audit a bundled server and upload SARIF to GitHub code scanning.
      - run: .venv/bin/mcpguard scan test_servers/poisoned_weather --sandbox static --no-ai --report sarif --output mcpguard.sarif --fail-on never
      - uses: github/codeql-action/upload-sarif@v3
        if: github.event_name == 'push'
        with:
          sarif_file: mcpguard.sarif
          category: mcpguard

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
